[package]
name = "ephact-presentation"
version = "0.3.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2"
ratatui-image = { version = "8", default-features = false, features = ["image-defaults"] }
image = { version = "0.25.6", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
ratatui = "0.29"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "libc", "serde", "windows"] }
figlet-rs = "1.0.0"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }

# Dependencies on the application layer
ephact-application = { path = "../application", version = "0.3.0" }

# Dependencies on the domain layer
ephact-domain = { path = "../domain", version = "0.3.0" }
ephact-infrastructure = { path = "../infrastructure", version = "0.3.0" }

[dev-dependencies]
serde_json = "1"

[features]
container-integration = []