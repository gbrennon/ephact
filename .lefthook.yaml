# EphemeralAct lefthook configuration
# Install: pipx install lefthook && lefthook install

pre-commit:
  parallel: false
  jobs:
    - name: Auto-fix staged files
      stage_fixed: true
      run: |
        set -eu
        STAGED_RUST_FILES=$(git diff --cached --name-only --diff-filter=ACM | { grep -E '\.rs$' || true; } | tr '\n' ' ')
        if [ -n "$STAGED_RUST_FILES" ]; then
          rustfmt --edition 2024 $STAGED_RUST_FILES
          just lint-fix $STAGED_RUST_FILES
        fi


pre-push:
  parallel: false
  jobs:
    - name: Run quality checks
      run: |
        set -u
        export CARGO_TARGET_DIR="${TMPDIR:-/tmp}/ephact-target"
        just semgrep
        semgrep_status=$?
        cargo clippy --all-targets --locked -- -D warnings
        clippy_status=$?
        lizard -C 5 src
        lizard_status=$?
        if [ "$semgrep_status" -ne 0 ] || [ "$clippy_status" -ne 0 ] ||
            [ "$lizard_status" -ne 0 ]; then
          exit 1
        fi
