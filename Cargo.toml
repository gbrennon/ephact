[package]
name = "ephact"
version = "0.3.1"
edition = "2024"
description = "Runs actions and workflows locally in ephemeral repositories, isolated from your operating system."
license = "MIT OR Apache-2.0"

[dependencies]
ephact-domain = { path = "crates/domain", version = "0.3.0" }
ephact-application = { path = "crates/application", version = "0.3.0" }
ephact-infrastructure = { path = "crates/infrastructure", version = "0.3.0" }
ephact-presentation = { path = "crates/presentation", version = "0.3.0" }

[features]
container-integration = []

[dev-dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "libc", "serde", "windows"] }
image = { version = "0.25.6", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
parking_lot = "0.12"
ratatui = "0.29"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2"

[[test]]
name = "application"
path = "crates/application/tests/application/mod.rs"

[[test]]
name = "infrastructure"
path = "crates/infrastructure/tests/infrastructure/mod.rs"

[[test]]
name = "presentation"
path = "crates/presentation/tests/presentation/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[[test]]
name = "container_integration"
path = "crates/infrastructure/tests/container_integration/mod.rs"
required-features = ["container-integration"]

[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
]
