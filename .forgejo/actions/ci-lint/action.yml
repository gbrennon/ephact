name: Lint Rust project
description: Run the Rust linter with warnings denied

runs:
  using: composite

  steps:
    - name: Clippy
      shell: bash
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Response DTO conventions
      shell: bash
      run: scripts/check_response_dto_conventions.sh

    - name: Rust file conventions
      shell: bash
      run: scripts/check_changed_rust_conventions.sh

    - name: Rust convention regression test
      shell: bash
      run: tests/scripts/rust_file_struct_names_test.sh
