name: Update changelog
description: Generate and commit a changelog
inputs:
  version:
    description: Release tag name used for versioned changelog generation
    required: false
    default: ""
  target-branch:
    description: Branch used as the changelog source and direct push target
    required: true
  base-branch:
    description: Base branch for an optional changelog pull request
    required: false
    default: ""
  pull-request-branch:
    description: Optional branch that receives changelog commits for a pull request
    required: false
    default: ""
  create-pull-request:
    description: Whether to create a pull request instead of pushing the target branch
    required: false
    default: "false"
  api-url:
    description: Forgejo API base URL used to create the pull request
    required: false
    default: ""
  repository:
    description: Forgejo repository in owner/repository format
    required: false
    default: ""
  token:
    description: Built-in Forgejo token used to create the pull request
    required: false
    default: ""
  pull-request-title:
    description: Title for the generated changelog pull request
    required: false
    default: "chore(release): update changelog"
  pull-request-body:
    description: Body for the generated changelog pull request
    required: false
    default: "Automated changelog update"
  push-retry-delay-seconds:
    description: Initial delay between changelog push retries
    required: false
    default: "5"
  git-user-name:
    description: Name used for the changelog commit
    required: true
  git-user-email:
    description: Email used for the changelog commit
    required: true
runs:
  using: composite
  steps:
    - name: Generate and commit changelog
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        PULL_REQUEST_BRANCH: ${{ inputs.pull-request-branch }}
        CREATE_PULL_REQUEST: ${{ inputs.create-pull-request }}
        FORGEJO_API_URL: ${{ inputs.api-url }}
        FORGEJO_REPOSITORY: ${{ inputs.repository }}
        FORGEJO_TOKEN: ${{ inputs.token }}
        PULL_REQUEST_TITLE: ${{ inputs.pull-request-title }}
        PULL_REQUEST_BODY: ${{ inputs.pull-request-body }}
        PUSH_RETRY_DELAY_SECONDS: ${{ inputs.push-retry-delay-seconds }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: bash scripts/update_changelog.sh
