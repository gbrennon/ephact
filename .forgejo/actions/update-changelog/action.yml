name: Update changelog
description: Generate and commit a changelog
inputs:
  version:
    description: Release tag name used for versioned changelog generation
    required: false
    default: ""
  target-branch:
    description: Branch to which the updated changelog commit is pushed
    required: true
runs:
  using: composite
  steps:
    - name: Generate and commit changelog
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: bash scripts/update_changelog.sh
