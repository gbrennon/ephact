name: Update changelog
description: Generate and commit a changelog
inputs:
  version:
    description: Release tag name used for versioned changelog generation
    required: false
    default: ""
  target-branch:
    description: Branch to which the updated changelog commit is pushed
    required: true
  base-branch:
    description: Base branch for the changelog pull request
    required: false
    default: ""
  pull-request-branch:
    description: Topic used for the changelog pull request
    required: false
    default: ""
  create-pull-request:
    description: Whether to create a pull request instead of pushing the target branch
    required: false
    default: "false"
  push-retry-delay-seconds:
    description: Initial delay between changelog push retries
    required: false
    default: "5"
  git-user-name:
    description: Name used for the changelog commit
    required: true
  git-user-email:
    description: Email used for the changelog commit
    required: true
runs:
  using: composite
  steps:
    - name: Generate and commit changelog
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        PULL_REQUEST_BRANCH: ${{ inputs.pull-request-branch }}
        CREATE_PULL_REQUEST: ${{ inputs.create-pull-request }}
        PUSH_RETRY_DELAY_SECONDS: ${{ inputs.push-retry-delay-seconds }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: bash scripts/update_changelog.sh
