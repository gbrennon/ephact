name: Setup Rust environment
description: Install project dependencies and prepare the Rust dependency cache

inputs:
  cache-key-prefix:
    description: Base identifier prefix for the Rust dependency cache
    required: true
  rustc-version:
    description: Rust compiler version used as a cache key component
    required: false
    default: stable
  include-sysroot:
    description: Whether Rust standard library sysroot artifacts are cached
    required: false
    default: "false"

runs:
  using: composite

  steps:
    - uses: ./.forgejo/actions/install-dependencies
    - uses: ./.forgejo/actions/cache-rust-deps
      with:
        cache-key-prefix: ${{ inputs.cache-key-prefix }}
        rustc-version: ${{ inputs.rustc-version }}
        include-sysroot: ${{ inputs.include-sysroot }}
