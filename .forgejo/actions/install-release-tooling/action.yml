name: Install release tooling
description: Install curl and jq for release API calls

runs:
  using: composite
  steps:
    - name: Install release tooling
      shell: bash
      run: |
        set -euo pipefail

        if command -v curl >/dev/null 2>&1 &&
           command -v jq >/dev/null 2>&1; then
          printf 'Release tooling already installed\n'
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y curl jq
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache curl jq
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y curl jq
        elif command -v yum >/dev/null 2>&1; then
          yum install -y curl jq
        else
          printf 'No known package manager found. Trying to continue anyway\n'
        fi

        if ! command -v curl >/dev/null 2>&1 ||
           ! command -v jq >/dev/null 2>&1; then
          printf 'Release tooling unavailable: curl and jq are required\n' >&2
          exit 1
        fi
