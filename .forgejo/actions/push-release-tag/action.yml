name: Push release tag
description: Create and push the release tag
inputs:
  version:
    description: >-
      Release tag name (for example v0.2.0) created and pushed to origin
      remote refs/tags
    required: true
runs:
  using: composite
  steps:
    - name: Create and push release tag
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        git tag "$VERSION"
        git push origin "refs/tags/$VERSION"
