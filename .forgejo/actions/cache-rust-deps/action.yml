name: Cache Rust dependencies
description: Cache Cargo registry, git checkouts, and build artifacts

inputs:
  cache-key-prefix:
    description: >-
      Base identifier prefix (such as ephact or ephact-release) prepended
      to the runner cache key to isolate dependency caches
    required: true
  rustc-version:
    description: >-
      Installed Rust compiler version used as a cache key component so
      toolchain updates invalidate stale build caches
    required: false
    default: stable
  include-sysroot:
    description: >-
      Flag indicating whether Rust standard library sysroot artifacts
      should be retained across cached workflow runs
    required: false
    default: "false"

runs:
  using: composite

  steps:
    - name: Cache Cargo registry
      shell: bash
      run: echo "Cache registry (no-op in ephemeral container)"

    - name: Cache Cargo git checkouts
      shell: bash
      run: echo "Cache git checkouts (no-op in ephemeral container)"

    - name: Cache build artifacts
      shell: bash
      run: echo "Cache build artifacts (no-op in ephemeral container)"
