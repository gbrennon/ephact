name: Publish crates to staging
description: >-
  Publish every workspace crate to the crates.io staging registry, in
  dependency order, with a unique pre-release version
inputs:
  token:
    description: >-
      API token with publish permissions for staging.crates.io, used to
      authenticate the cargo publish command against the staging registry
    required: true
  short-sha:
    description: >-
      Git commit SHA used to derive a unique pre-release version suffix
      (such as 0.2.0-staging-pr42-abc1234) ensuring duplicate versions are not
      published
    required: true
  pr-number:
    description: >-
      Pull request number (for example 42) used to identify the originating
      pull request in the staging pre-release version
    required: true
runs:
  using: composite
  steps:
    - name: Publish to staging registry
      shell: bash
      env:
        CARGO_REGISTRIES_STAGING_INDEX: sparse+https://index.staging.crates.io/
        CARGO_REGISTRIES_STAGING_TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.short-sha }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail

        if [[ -z "$CARGO_REGISTRIES_STAGING_TOKEN" ]]; then
          printf 'CARGO_REGISTRIES_STAGING_TOKEN is not configured\n' >&2
          exit 1
        fi

        ordered=(
          ephact-domain
          ephact-application
          ephact-infrastructure
          ephact-presentation
          ephact
        )

        metadata="$(cargo metadata --no-deps --format-version 1)"
        workspace_packages="$(
          jq -r '[.packages[] | select(.source == null) | .name] | sort | .[]' \
            <<<"$metadata"
        )"
        declared_packages="$(printf '%s\n' "${ordered[@]}" | sort)"
        if [[ "$workspace_packages" != "$declared_packages" ]]; then
          printf 'workspace packages:\n%s\n' "$workspace_packages" >&2
          printf 'declared publish order:\n%s\n' "$declared_packages" >&2
          printf 'workspace members changed; update the publish order in this action\n' >&2
          exit 1
        fi

        short_sha="${SHA:0:7}"
        base_version="$(
          jq -r '.packages[] | select(.name == "ephact") | .version' <<<"$metadata"
        )"
        staging_version="${base_version}-staging-pr${PR_NUMBER}-${short_sha}"

        manifests=(Cargo.toml crates/*/Cargo.toml)
        for manifest in "${manifests[@]}"; do
          sed -i -E \
            -e "0,/^version = \"[^\"]*\"/s//version = \"${staging_version}\"/" \
            -e "s/^(ephact-[a-z]+ = \{ path = \"[^\"]+\"), version = \"[^\"]*\" \}$/\1, version = \"${staging_version}\", registry = \"staging\" }/" \
            "$manifest"
        done

        staged_metadata="$(cargo metadata --no-deps --format-version 1)"
        unstaged="$(
          jq -r \
            --arg version "$staging_version" \
            --arg registry "$CARGO_REGISTRIES_STAGING_INDEX" \
            '[.packages[] | select(.source == null) | .name] as $internal
            | .packages[] | select(.source == null)
            | (select(.version != $version) | "\(.name): package version \(.version)"),
              (.name as $pkg | .dependencies[]
                | select(.name as $dep | $internal | index($dep))
                | select(.req != "^\($version)" or .registry != $registry or .path == null)
                | "\($pkg) -> \(.name): req=\(.req) registry=\(.registry) path=\(.path)")' \
            <<<"$staged_metadata"
        )"
        if [[ -n "$unstaged" ]]; then
          printf 'manifests not fully staged (manifest layout changed?):\n%s\n' "$unstaged" >&2
          exit 1
        fi

        index_url="${CARGO_REGISTRIES_STAGING_INDEX#sparse+}"
        index_url="${index_url%/}"
        publish_log="$(mktemp)"

        wait_for_index() {
          local crate="$1"
          local index_path="${crate:0:2}/${crate:2:2}/${crate}"
          local attempt entries
          for attempt in $(seq 1 24); do
            entries="$(
              curl -sf -H "Authorization: ${CARGO_REGISTRIES_STAGING_TOKEN}" \
                "${index_url}/${index_path}" || true
            )"
            if [[ "$entries" == *"\"vers\":\"${staging_version}\""* ]]; then
              rm -f "${CARGO_HOME:-$HOME/.cargo}"/registry/index/*/.cache/"${index_path}"
              return 0
            fi
            printf 'waiting for %s@%s in the staging index (attempt %d)\n' \
              "$crate" "$staging_version" "$attempt"
            sleep 5
          done
          printf 'index did not show %s@%s\n' "$crate" "$staging_version" >&2
          return 1
        }

        for crate in "${ordered[@]}"; do
          if ! cargo publish -p "$crate" --registry staging --allow-dirty 2>&1 \
            | tee "$publish_log"; then
            if grep -qE 'already uploaded|already exists' "$publish_log"; then
              printf '%s@%s is already published; continuing\n' \
                "$crate" "$staging_version"
            else
              exit 1
            fi
          fi
          if [[ "$crate" != ephact ]]; then
            wait_for_index "$crate"
          fi
        done
