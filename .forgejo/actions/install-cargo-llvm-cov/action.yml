name: Install cargo-llvm-cov
description: Install the pinned cargo-llvm-cov release

runs:
  using: composite

  steps:
    - name: Install nightly coverage toolchain
      shell: bash
      run: scripts/install_coverage_toolchain.sh
    - name: Install cargo-llvm-cov
      shell: bash
      run: |
        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        cargo_bin="$cargo_home/bin"
        export CARGO_HOME="$cargo_home"
        export PATH="$cargo_bin:$PATH"
        echo "$cargo_bin" >> "$GITHUB_PATH"
        echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
        echo "PATH=$cargo_bin:$PATH" >> "$GITHUB_ENV"
        if command -v cargo-llvm-cov >/dev/null 2>&1; then
          echo "cargo-llvm-cov already installed: $(cargo llvm-cov --version)"
          exit 0
        fi

        arch=$(uname -m)
        case "$arch" in
          x86_64) target="x86_64-unknown-linux-gnu" ;;
          aarch64) target="aarch64-unknown-linux-gnu" ;;
          *)
            echo "unsupported architecture: $arch" >&2
            exit 1
            ;;
        esac

        curl -fsSL --proto '=https' --tlsv1.2 \
          -o /tmp/cargo-llvm-cov.tar.gz \
          "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-${target}.tar.gz"
        mkdir -p "$cargo_bin"
        tar -xzf /tmp/cargo-llvm-cov.tar.gz -C "$cargo_bin"
        rm -f /tmp/cargo-llvm-cov.tar.gz
        "$cargo_bin/cargo" llvm-cov --version
