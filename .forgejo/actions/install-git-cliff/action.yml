name: Install git-cliff
description: Install the pinned git-cliff release

runs:
  using: composite

  steps:
    - name: Install git-cliff
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        if command -v git-cliff >/dev/null 2>&1; then
          echo "git-cliff already installed: $(git-cliff --version)"
          exit 0
        fi

        ./.forgejo/scripts/install_git_cliff.sh
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        "$HOME/.cargo/bin/git-cliff" --version
