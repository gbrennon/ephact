name: Install git-cliff
description: Install the pinned git-cliff release

runs:
  using: composite

  steps:
    - name: Install git-cliff
      shell: bash
      run: |
        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        cargo_bin="$cargo_home/bin"
        export CARGO_HOME="$cargo_home"
        export PATH="$cargo_bin:$PATH"
        echo "$cargo_bin" >> "$GITHUB_PATH"
        echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
        echo "PATH=$cargo_bin:$PATH" >> "$GITHUB_ENV"
        if command -v git-cliff >/dev/null 2>&1; then
          echo "git-cliff already installed: $(git-cliff --version)"
          exit 0
        fi

        ./.forgejo/scripts/install_git_cliff.sh
        echo "$cargo_bin" >> "$GITHUB_PATH"
        echo "PATH=$cargo_bin:$PATH" >> "$GITHUB_ENV"
        "$cargo_bin/git-cliff" --version
