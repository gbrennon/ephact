name: Create GitHub release
description: Publish a release through the GitHub API
inputs:
  api-url:
    description: >-
      GitHub API base URL (for example https://api.github.com) used for
      GitHub REST API requests
    required: true
  repository:
    description: >-
      Target GitHub repository in owner/repo format (for example
      gbrennon/ephact) to mirror the release to
    required: true
  token:
    description: >-
      GitHub Personal Access Token with release and contents write permissions
      used to authenticate API calls to GitHub
    required: true
  merge-commit-sha:
    description: >-
      Full Git commit SHA of the merged pull request used as the release
      commit targetish
    required: true
  version:
    description: >-
      Release tag name (for example v0.2.0) used for the release name, Git
      tag, and release notes header
    required: true
runs:
  using: composite
  steps:
    - name: Create GitHub release
      shell: bash
      env:
        GITHUB_API_URL: ${{ inputs.api-url }}
        GITHUB_REPOSITORY: ${{ inputs.repository }}
        GH_RELEASE_TOKEN: ${{ inputs.token }}
        MERGE_COMMIT_SHA: ${{ inputs.merge-commit-sha }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ -z "$GH_RELEASE_TOKEN" ]]; then
          printf \
            'GH_RELEASE_TOKEN secret is not configured in the Codeberg repository\n' \
            >&2
          exit 1
        fi

        payload="$(
          jq -n \
            --arg tag_name "$VERSION" \
            --arg target_commitish "$MERGE_COMMIT_SHA" \
            --arg name "$VERSION" \
            --rawfile body release-notes.md \
            '{
              tag_name: $tag_name,
              target_commitish: $target_commitish,
              name: $name,
              body: $body,
              draft: false,
              prerelease: false
            }'
        )"
        response_file="$(mktemp)"
        trap 'rm -f "$response_file"' EXIT
        http_status="$(
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            --header "Authorization: Bearer ${GH_RELEASE_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --data "$payload"
        )"
        if (( http_status < 200 || http_status >= 300 )); then
          printf 'Release API returned HTTP status: %s\n' "$http_status" >&2
          cat "$response_file" >&2
          exit 1
        fi
        cat "$response_file"
