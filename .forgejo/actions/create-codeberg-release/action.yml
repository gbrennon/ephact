name: Create Codeberg release
description: Publish a release through the Codeberg API
inputs:
  api-url:
    description: >-
      Codeberg or Forgejo instance API base URL (for example
      https://codeberg.org/api/v1) used for release API calls
    required: true
  repository:
    description: >-
      Target Codeberg repository in owner/repo format (for example
      gbrennon/ephact) where the release will be published
    required: true
  token:
    description: >-
      Codeberg API token or built-in Forgejo Actions runner token used to
      authenticate the release creation request
    required: true
  version:
    description: >-
      Release tag name (for example v0.2.0) used as the release title, Git
      tag reference, and changelog heading identifier
    required: true
runs:
  using: composite
  steps:
    - name: Create Codeberg release
      shell: bash
      env:
        FORGEJO_API_URL: ${{ inputs.api-url }}
        FORGEJO_REPOSITORY: ${{ inputs.repository }}
        FORGEJO_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        payload="$(
          jq -n \
            --arg tag_name "$VERSION" \
            --arg name "$VERSION" \
            --rawfile body release-notes.md \
            '{
              tag_name: $tag_name,
              name: $name,
              body: $body,
              draft: false,
              prerelease: false
            }'
        )"
        response_file="$(mktemp)"
        trap 'rm -f "$response_file"' EXIT
        http_status="$(
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases" \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header 'Content-Type: application/json' \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --data "$payload"
        )"
        if (( http_status < 200 || http_status >= 300 )); then
          printf 'Release API returned HTTP status: %s\n' "$http_status" >&2
          cat "$response_file" >&2
          exit 1
        fi
        cat "$response_file"
