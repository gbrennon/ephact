name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/setup-rust-environment
        with:
          cache-key-prefix: ephact
          rustc-version: stable
          include-sysroot: "false"
      - name: Check formatting
        run: cargo fmt --all -- --check

  workflow-lint:
    name: Workflow lint
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: |
          case "$(uname -m)" in
            x86_64) asset_arch="amd64" ;;
            aarch64|arm64) asset_arch="arm64" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL --proto '=https' --tlsv1.2 \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_${asset_arch}.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          rm -f /tmp/actionlint.tar.gz /tmp/actionlint
          actionlint -version
      - name: Validate workflows
        run: actionlint -config-file .actionlint.yaml .forgejo/workflows/*.yml

  test:
    name: Test
    runs-on: codeberg-medium
    needs: [validate]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/setup-rust-environment
        with:
          cache-key-prefix: ephact
          rustc-version: stable
          include-sysroot: "false"
      - uses: ./.forgejo/actions/run-tests

  lint:
    name: Lint
    runs-on: codeberg-medium
    needs: [validate]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/setup-rust-environment
        with:
          cache-key-prefix: ephact
          rustc-version: stable
          include-sysroot: "false"
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  verify-secrets:
    name: Verify secrets
    runs-on: codeberg-tiny
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
      - uses: ./.forgejo/actions/install-dependencies
      - name: Verify GitHub release token
        uses: ./.forgejo/actions/verify-token
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          secret-name: GH_RELEASE_TOKEN
          validate-url: https://api.github.com/user
          auth-scheme: bearer
      - name: Verify crates.io production token
        uses: ./.forgejo/actions/verify-token
        with:
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          secret-name: CARGO_REGISTRY_TOKEN
          validate-url: https://crates.io/api/v1/me
          auth-scheme: bearer
      - name: Verify Codeberg token
        uses: ./.forgejo/actions/verify-token
        with:
          token: ${{ github.token }}
          secret-name: FORGEJO_TOKEN
          validate-url: ${{ github.api_url }}/repos/${{ github.repository }}
          auth-scheme: token
