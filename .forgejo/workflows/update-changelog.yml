name: Update changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: changelog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Update changelog
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.head.label, '/chore/changelog/') &&
      !contains(github.event.pull_request.head.label, '/release/v')
    runs-on: codeberg-small
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.CODEBERG_TOKEN }}

      - name: Install git-cliff
        uses: ./.forgejo/actions/install-git-cliff

      - name: Update unreleased changelog
        uses: ./.forgejo/actions/update-changelog
        with:
          git-user-name: ${{ github.event.pull_request.user.login }}
          git-user-email: ${{ github.event.pull_request.user.login }}@users.noreply.codeberg.org
          target-branch: main
          base-branch: main
          pull-request-branch: chore/changelog/${{ github.run_id }}
          create-pull-request: "true"
