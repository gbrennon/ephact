name: Update changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:

concurrency:
  group: changelog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Update changelog
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'chore/changelog/') &&
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      !startsWith(github.event.pull_request.title, 'chore(release): update changelog')
    runs-on: codeberg-small
    env:
      CHANGELOG_BRANCH: chore/changelog/${{ github.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}


      - name: Install git-cliff
        uses: ./.forgejo/actions/install-git-cliff

      - name: Update unreleased changelog
        uses: ./.forgejo/actions/update-changelog
        with:
          git-user-name: ${{ github.actor }}
          git-user-email: ${{ github.actor }}@users.noreply.codeberg.org
          target-branch: ${{ env.DEFAULT_BRANCH }}
          base-branch: ${{ env.DEFAULT_BRANCH }}
          pull-request-branch: ${{ env.CHANGELOG_BRANCH }}
          create-pull-request: "true"
